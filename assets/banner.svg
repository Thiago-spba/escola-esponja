<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Escola Esponja: o Telhado que Respira">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4f7a"/>
      <stop offset="0.6" stop-color="#0e7c86"/>
      <stop offset="1" stop-color="#0a5d73"/>
    </linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe9f8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .drop{stroke:#bfe9ff;stroke-width:3;stroke-linecap:round;opacity:0;animation:fall 1.6s linear infinite}
    @keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:.9}100%{transform:translateY(150px);opacity:0}}
    .bub{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.35);stroke-width:2;animation:rise 12s linear infinite}
    @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-380px)}}
    .cloud{animation:float 5s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-8px)}}
    .grass{fill:#5cb85c}
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
    @keyframes sway{50%{transform:rotate(4deg)}}
    .t1{font:800 64px "Trebuchet MS","Segoe UI",Arial,sans-serif;fill:#fff}
    .t2{font:800 38px "Trebuchet MS","Segoe UI",Arial,sans-serif;fill:#8ff0a4}
    .t3{font:600 19px "Trebuchet MS","Segoe UI",Arial,sans-serif;fill:#d8f6ff;letter-spacing:2px}
    .fade{animation:fade 1.4s ease-out both}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="bub" cx="140" cy="360" r="26"/><circle class="bub" cx="420" cy="380" r="16" style="animation-delay:-4s"/>
    <circle class="bub" cx="760" cy="370" r="22" style="animation-delay:-7s"/><circle class="bub" cx="1010" cy="390" r="30" style="animation-delay:-2s"/>
    <circle class="bub" cx="1130" cy="360" r="14" style="animation-delay:-9s"/>

    <!-- nuvem -->
    <g class="cloud" fill="url(#cl)">
      <rect x="70" y="52" width="250" height="62" rx="31"/>
      <circle cx="120" cy="52" r="34"/><circle cx="178" cy="40" r="42"/><circle cx="242" cy="50" r="34"/>
      <circle cx="104" cy="104" r="24"/><circle cx="214" cy="108" r="26"/><circle cx="286" cy="98" r="24"/>
    </g>
    <!-- chuva -->
    <g>
      <line class="drop" x1="110" y1="140" x2="104" y2="158" style="animation-delay:0s"/>
      <line class="drop" x1="150" y1="140" x2="144" y2="158" style="animation-delay:-.5s"/>
      <line class="drop" x1="190" y1="140" x2="184" y2="158" style="animation-delay:-1s"/>
      <line class="drop" x1="230" y1="140" x2="224" y2="158" style="animation-delay:-.3s"/>
      <line class="drop" x1="270" y1="140" x2="264" y2="158" style="animation-delay:-.8s"/>
      <line class="drop" x1="130" y1="140" x2="124" y2="158" style="animation-delay:-1.2s"/>
      <line class="drop" x1="250" y1="140" x2="244" y2="158" style="animation-delay:-1.4s"/>
    </g>
    <!-- telhado verde -->
    <rect x="40" y="272" width="310" height="48" fill="#6b4a2f"/>
    <rect x="40" y="262" width="310" height="14" fill="#5cb85c"/>
    <g class="grass">
      <path class="sway" d="M70 264 q-4 -22 4 -30 q2 16 6 30z"/><path class="sway" d="M110 264 q-4 -26 6 -34 q2 18 6 34z" style="animation-delay:-1s"/>
      <path class="sway" d="M160 264 q-4 -20 4 -28 q2 14 6 28z" style="animation-delay:-2s"/><path class="sway" d="M210 264 q-4 -26 6 -34 q2 18 6 34z" style="animation-delay:-.6s"/>
      <path class="sway" d="M260 264 q-4 -22 4 -30 q2 16 6 30z" style="animation-delay:-1.6s"/><path class="sway" d="M310 264 q-4 -20 4 -28 q2 14 6 28z" style="animation-delay:-2.4s"/>
    </g>
    <circle cx="96" cy="248" r="5" fill="#ffd166"/><circle cx="188" cy="244" r="5" fill="#ff7aa2"/><circle cx="238" cy="250" r="5" fill="#ffd166"/><circle cx="290" cy="246" r="5" fill="#b28dff"/>

    <!-- textos -->
    <g class="fade">
      <text class="t1" x="400" y="130">Escola Esponja</text>
      <text class="t2" x="402" y="190">o Telhado que Respira</text>
      <text class="t3" x="404" y="250">ELETIVAS · CULMINÂNCIA · E.E. MOACYR AMARAL DOS SANTOS</text>
    </g>
  </g>
</svg>
